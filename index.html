    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    .pub .meta a:hover, .pub .meta button:hover { text-decoration-color: var(--sun); }
    .empty { color: var(--muted); padding: 1.2rem 0; }
    @media (max-width: 520px) { .pub { grid-template-columns: 1fr; gap: .3rem; } }
 
    /* ---------- Advisors and co-authors ---------- */
    .people { margin-top: 3rem; }
    .people ul { list-style: none; padding: 0; margin: 0; border-top: 1.5px solid var(--ink); }
    .people li { display: flex; justify-content: space-between; gap: 1rem; padding: .85rem 0; border-bottom: 1px solid var(--line); }
    .people .who { font-weight: 600; text-underline-offset: 4px; text-decoration-color: var(--line); text-decoration-thickness: 2px; }
    .people a.who:hover { text-decoration-color: var(--sun); }

    footer { grid-column: 1 / -1; color: var(--muted); font-size: .875rem; }
 
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card { animation: none; }
      * { transition: none !important; }
    }
 
    /* Printing: clean one-column sheet, no buttons */
    @media print {
      body { background: #fff; color: #000; }
      .page { display: block; padding: 0; }
      .actions, .filters, .pub .meta button { display: none !important; }
      .card { box-shadow: none; animation: none; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .pub, .edu li { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="identity" aria-label="Academic profile">
      <div class="card">
        <div>
          <h1 id="name"></h1>
          <p class="role" id="role"></p>
        </div>
        <ul class="contact" id="contact"></ul>
      </div>
 
      <div class="actions">
        <a class="btn primary" id="cvLink" href="#" download hidden>Download CV</a>
        <button class="btn" id="saveContact" type="button">Save contact</button>
        <button class="btn" id="copyLink" type="button">Copy link</button>
      </div>
 
      <p class="bio" id="bio"></p>
 
      <div class="block" id="interestsWrap" hidden>
        <h2 class="small">Research interests</h2>
        <ul class="tags" id="interests"></ul>
      </div>
 
      <div class="block" id="eduWrap" hidden>
        <h2 class="small">Education</h2>
        <ul class="edu" id="edu"></ul>
      </div>
 
      <div class="block" id="linksWrap" hidden>
        <h2 class="small">Find me</h2>
        <ul class="links" id="links"></ul>
      </div>
    </section>
 
    <section aria-labelledby="pub-title">
      <h2 id="pub-title">Publications</h2>
      <div class="filters" id="filters" role="group" aria-label="Filter publications by type"></div>
      <ul class="pub-list" id="pubs"></ul>
 
      <div class="people" id="peopleWrap" hidden>
        <h2>Advisors and co-authors</h2>
        <ul id="people"></ul>
      </div>
    </section>
 
    <footer id="footer"></footer>
  </main>
 
  <script>
    /* =====================================================
       EDIT THIS BLOCK ONLY. Everything on the page is built
       from it. Delete any line or item you don't need.
       ===================================================== */
    const CARD = {
      name: "Your Name",
      title: "PhD Candidate, Computer Science",
      org: "Your University",
      email: "you@university.edu",
      phone: "",                       // leave "" to hide
      website: "https://yourusername.github.io",
      bio: "Two or three sentences on your research focus, your methods, and what you are working on now.",
 
      cv: "cv.pdf",                    // upload your CV to the repo; "" hides the button
 
      interests: [
        "Natural language processing",
        "Human-computer interaction",
        "Low-resource languages"
      ],
 
      education: [
        { degree: "PhD, Computer Science", school: "Your University", years: "2024 to present", note: "Advisor: Dr. Advisor Name" },
        { degree: "BS, Information Technology", school: "Your First University", years: "2018 to 2022", note: "Thesis: Title of your thesis" }
      ],
 
      links: [
        { label: "ORCID",          url: "https://orcid.org/0000-0000-0000-0000" },
        { label: "Google Scholar", url: "https://scholar.google.com/" },
        { label: "ResearchGate",   url: "https://www.researchgate.net/" },
        { label: "GitHub",         url: "https://github.com/yourusername" }
      ],
 
      // type is used for the filter buttons (Journal, Conference, Preprint, Thesis, Poster...).
      // doi is just the number part, e.g. "10.1000/xyz123". url and pdf are optional.
      publications: [
        {
          title: "Sample paper title goes here",
          authors: ["Your Name", "Co-Author One", "Advisor Name"],
          venue: "Journal of Example Studies, 12(3), 45-67",
          year: 2026,
          type: "Journal",
          doi: "10.1000/xyz123",
          url: "",
          pdf: "",
          abstract: ""
        },
        {
          title: "Another sample paper presented at a conference",
          authors: ["Co-Author One", "Your Name"],
          venue: "Proceedings of the Example Conference",
          year: 2025,
          type: "Conference",
          doi: "",
          url: "https://example.com/paper",
          pdf: "papers/example.pdf",
          abstract: "Optional one or two sentence abstract shown under the citation."
        },
        {
          title: "Title of your undergraduate thesis",
          authors: ["Your Name"],
          venue: "Your First University, Bachelor's thesis",
          year: 2022,
          type: "Thesis",
          doi: "",
          url: "",
          pdf: "",
          abstract: ""
        }
      ],
 
      // Advisors, co-authors, labs. Use [] to hide.
      collaborators: [
        { name: "Dr. Advisor Name", role: "Doctoral advisor", url: "https://example.edu" },
        { name: "Co-Author One", role: "Co-author", url: "" }
      ]
    };
    /* ===================== end of edit zone ===================== */
 
 
    const $ = (id) => document.getElementById(id);
 
    function make(tag, props = {}, children = []) {
      const node = document.createElement(tag);
      for (const [key, value] of Object.entries(props)) {
        if (key === "text") node.textContent = value;
        else node.setAttribute(key, value);
      }
      children.forEach((child) => node.append(child));
      return node;
    }
 
    const cleanUrl = (url) => url.replace(/^https?:\/\//, "").replace(/\/$/, "");
 
    /* ---- Identity ---- */
    document.title = `${CARD.name} | ${CARD.title}`;
    $("name").textContent = CARD.name;
    $("role").append(CARD.title);
    if (CARD.org) $("role").append(make("br"), make("span", { class: "org", text: CARD.org }));
    $("bio").textContent = CARD.bio || "";
    $("bio").hidden = !CARD.bio;
 
    [
      CARD.email && ["mailto:" + CARD.email, CARD.email],
      CARD.phone && ["tel:" + CARD.phone.replace(/\s/g, ""), CARD.phone],
      CARD.website && [CARD.website, cleanUrl(CARD.website)]
    ].filter(Boolean).forEach(([href, label]) => {
      $("contact").append(make("li", {}, [make("a", { href, text: label })]));
    });
 
    if (CARD.cv) {
      $("cvLink").href = CARD.cv;
      $("cvLink").hidden = false;
    }
 
    /* ---- Interests, education, links ---- */
    if ((CARD.interests || []).length) {
      $("interestsWrap").hidden = false;
      CARD.interests.forEach((i) => $("interests").append(make("li", { text: i })));
    }
 
    if ((CARD.education || []).length) {
      $("eduWrap").hidden = false;
      CARD.education.forEach((e) => {
        const item = make("li", {}, [
          make("div", { class: "deg", text: e.degree }),
          make("div", { class: "meta", text: [e.school, e.years].filter(Boolean).join(", ") })
        ]);
        if (e.note) item.append(make("div", { class: "meta", text: e.note }));
        $("edu").append(item);
      });
    }
 
    if ((CARD.links || []).length) {
      $("linksWrap").hidden = false;
      CARD.links.forEach((l) => {
        $("links").append(make("li", {}, [
          make("a", { href: l.url, target: "_blank", rel: "noopener", text: l.label })
        ]));
      });
    }
 
    /* ---- Publications with type filters ---- */
    const pubs = CARD.publications || [];
    const types = [...new Set(pubs.map((p) => p.type).filter(Boolean))];
    let activeType = "All";
 
    function citation(p) {
      const parts = [
        `${p.authors.join(", ")} (${p.year}). ${p.title}.`,
        p.venue ? `${p.venue}.` : "",
        p.doi ? `https://doi.org/${p.doi}` : (p.url || "")
      ];
      return parts.filter(Boolean).join(" ");
    }
 
    function renderAuthors(authors) {
      const box = make("p", { class: "authors" });
      authors.forEach((a, i) => {
        box.append(a === CARD.name ? make("strong", { text: a }) : document.createTextNode(a));
        if (i < authors.length - 1) box.append(", ");
      });
      return box;
    }
 
    function renderPubs() {
      const list = $("pubs");
      list.replaceChildren();
      const shown = pubs.filter((p) => activeType === "All" || p.type === activeType);
 
      if (!shown.length) {
        list.append(make("li", { class: "empty", text: "No publications of this type yet." }));
        return;
      }
 
      shown.forEach((p) => {
        const href = p.doi ? `https://doi.org/${p.doi}` : p.url;
        const title = make("h3", {}, [
          href ? make("a", { href, target: "_blank", rel: "noopener", text: p.title }) : document.createTextNode(p.title)
        ]);
 
        const body = make("div", {}, [title, renderAuthors(p.authors || [])]);
        if (p.venue) body.append(make("p", { class: "venue", text: p.venue }));
        if (p.abstract) body.append(make("p", { class: "abstract", text: p.abstract }));
 
        const meta = make("div", { class: "meta" });
        if (p.type) meta.append(make("span", { class: "type", text: p.type }));
        if (p.pdf) meta.append(make("a", { href: p.pdf, target: "_blank", rel: "noopener", text: "PDF" }));
        const copy = make("button", { type: "button", text: "Copy citation" });
        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(citation(p));
            copy.textContent = "Copied";
          } catch (err) {
            copy.textContent = "Copy failed";
          }
          setTimeout(() => (copy.textContent = "Copy citation"), 1800);
        });
        meta.append(copy);
        body.append(meta);
 
        const row = make("article", { class: "pub" }, [make("span", { class: "year", text: p.year || "" }), body]);
        list.append(make("li", {}, [row]));
      });
    }
 
    function renderFilters() {
      const box = $("filters");
      box.replaceChildren();
      if (types.length < 2) return;
      ["All", ...types].forEach((type) => {
        const chip = make("button", { class: "chip", type: "button", "aria-pressed": String(type === activeType), text: type });
        chip.addEventListener("click", () => {
          activeType = type;
          renderFilters();
          renderPubs();
        });
        box.append(chip);
      });
    }
    renderFilters();
    renderPubs();
 
    /* ---- Advisors and co-authors ---- */
    const people = CARD.collaborators || [];
    if (people.length) {
      $("peopleWrap").hidden = false;
      people.forEach((p) => {
        const who = p.url
          ? make("a", { class: "who", href: p.url, target: "_blank", rel: "noopener", text: p.name })
          : make("span", { class: "who", text: p.name });
        $("people").append(make("li", {}, [who, make("span", { class: "what", text: p.role || "" })]));
      });
    }
 
    /* ---- Save contact (.vcf) ---- */
    $("saveContact").addEventListener("click", () => {
      const lines = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        `FN:${CARD.name}`,
        CARD.org && `ORG:${CARD.org}`,
        CARD.title && `TITLE:${CARD.title}`,
        CARD.phone && `TEL;TYPE=CELL:${CARD.phone}`,
        CARD.email && `EMAIL:${CARD.email}`,
        CARD.website && `URL:${CARD.website}`,
        "END:VCARD"
      ].filter(Boolean);
      const blob = new Blob([lines.join("\r\n")], { type: "text/vcard" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = CARD.name.toLowerCase().replace(/\s+/g, "-") + ".vcf";
      document.body.append(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    });
 
    /* ---- Copy link ---- */
    $("copyLink").addEventListener("click", async (event) => {
      const button = event.currentTarget;
      try {
        await navigator.clipboard.writeText(location.href);
        button.textContent = "Link copied";
      } catch (err) {
        button.textContent = "Copy failed";
      }
      setTimeout(() => (button.textContent = "Copy link"), 1800);
    });
 
    $("footer").textContent = `© ${new Date().getFullYear()} ${CARD.name}`;
  </script>
</body>
